spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]
spring.application.name=villegas

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.sql.init.mode=never
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}

legacy.supply.api.key=${LEGACY_SUPPLY_API_KEY}
legacy.supply.api.url=${LEGACY_SUPPLY_API_URL:https://legacysupply.onrender.com/api/v1}
legacy.supply.client.id=${LEGACY_SUPPLY_CLIENT_ID}