spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]
spring.application.name=villegas

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.sql.init.mode=never
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}

legacy.supply.api.key=${LEGACY_SUPPLY_API_KEY}
legacy.supply.api.url=${LEGACY_SUPPLY_API_URL:https://legacysupply.onrender.com/api/v1}
legacy.supply.client.id=${LEGACY_SUPPLY_CLIENT_ID}
legacysupply.client-id=${LEGACY_SUPPLY_CLIENT_ID}
legacysupply.api-key=${LEGACY_SUPPLY_API_KEY}
legacysupply.base-url=${LEGACY_SUPPLY_API_URL:https://legacysupply.onrender.com/api/v1}
legacy.supply.session-renew-after-seconds=150

spring.datasource.hikari.minimum-idle=1
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
inventory.reorder-target=20
server.port=8080
legacysupply.session-renew-after-seconds=150

supplier.send-pending-every-ms=10000
supplier.track-deliveries-every-ms=15000

spring.task.scheduling.pool.size=4

orders.backorder-max-wait-seconds=600
orders.backorder-review-every-ms=20000

tiangge.base-url=https://legacysupply.onrender.com/tiangge/v1
tiangge.poll-every-ms=1000
tiangge.heartbeat-every-seconds=30